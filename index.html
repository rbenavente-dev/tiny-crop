<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PDF Redact Local (Destructive)</title>
    
    <script src="pdf.min.js"></script>
    <script src="pdf-lib.min.js"></script>
    <script src="FileSaver.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; background: #1a1a1a; color: #e0e0e0; margin: 0; min-height: 100vh; padding: 20px; }
        .container { width: 90%; max-width: 800px; text-align: center; margin-top: 20px; }
        h1 { color: #00ffcc; margin-bottom: 30px; }
        .step { background: #252525; border-radius: 12px; padding: 25px; margin-bottom: 20px; border: 2px solid #333; }
        .step.active { border-color: #00ffcc; }
        .step-title { font-size: 1.3em; font-weight: bold; color: #00ffcc; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .step-number { background: #00ffcc; color: #1a1a1a; width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: bold; }
        #drop-zone { padding: 40px; border: 3px dashed #444; border-radius: 15px; background: #2a2a2a; transition: all 0.3s; cursor: pointer; }
        #file-list { margin: 20px 0; text-align: left; background: #222; border-radius: 8px; max-height: 200px; overflow-y: auto; padding: 10px; display: none; }
        .file-item { font-size: 0.85em; padding: 5px; border-bottom: 1px solid #333; color: #00ffcc; }
        .btn { padding: 12px 25px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin: 5px; transition: all 0.2s; }
        .btn-primary { background: #00ffcc; color: #1a1a1a; }
        .btn-danger { background: #ff4444; color: white; }
        .btn-success { background: #44ff44; color: #1a1a1a; }
        .btn-skip { background: #555; color: white; }
        #work-area { display: none; width: 100%; flex-direction: column; align-items: center; margin-top: 20px; }
        #canvas-container { position: relative; border: 1px solid #444; cursor: crosshair; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin: 20px 0; background: white; }
        canvas { display: block; }
        #selection-box { position: absolute; border: 2px dashed #00ffcc; background: rgba(0, 255, 204, 0.2); display: none; pointer-events: none; }
        .input-group { margin: 15px 0; text-align: left; }
        .input-group label { display: block; margin-bottom: 8px; color: #00ffcc; font-weight: bold; }
        .input-group input, .input-group textarea, .input-group select { width: 100%; padding: 12px; border: 2px solid #444; border-radius: 5px; background: #2a2a2a; color: #e0e0e0; font-family: inherit; box-sizing: border-box; }
        #gemini-response { background: #2a2a2a; border: 2px solid #444; border-radius: 8px; padding: 20px; margin-top: 20px; text-align: left; max-height: 400px; overflow-y: auto; white-space: pre-wrap; }
        .hidden { display: none !important; }
        #loading-spinner { border: 4px solid #333; border-top: 4px solid #00ffcc; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <h1>📄 PDF Destructive Crop + 🤖 AI</h1>

    <div class="container">
        <div class="step active" id="step1">
            <div class="step-title"><span class="step-number">1</span> Cargar PDFs</div>
            <div id="drop-zone"><p>📁 Suelta los archivos aquí (Local Mode)</p></div>
            <div id="file-list"></div>
            <div id="actions" class="hidden">
                <button class="btn btn-primary" id="startBtn">Iniciar Recorte Seguro</button>
                <button class="btn btn-danger" id="clearBtn">Limpiar</button>
            </div>
        </div>

        <div class="step hidden" id="step2">
            <div class="step-title"><span class="step-number">2</span> Selección de Información</div>
            <p style="font-size: 0.9em; color: #bbb;">Dibuja un área para conservarla. Lo demás se eliminará.</p>
            <div id="work-area">
                <div id="canvas-container">
                    <canvas id="pdfCanvas"></canvas>
                    <div id="selection-box"></div>
                </div>
                <div>
                    <button class="btn btn-skip" id="skipPageBtn">Omitir esta página</button>
                </div>
            </div>
        </div>

        <div class="step hidden" id="step3">
            <div class="step-title"><span class="step-number">3</span> Análisis Seguro</div>
            <div class="input-group">
                <label>🔑 API Key:</label>
                <input type="password" id="apiKeyInput" placeholder="Clave API..." />
            </div>
            <div class="input-group">
                <label>🤖 Proveedor:</label>
                <select id="providerSelect">
                    <option value="gemini">Google Gemini 1.5 Flash</option>
                </select>
            </div>
            <div class="input-group">
                <label>💬 Prompt:</label>
                <textarea id="promptInput">Analiza únicamente los fragmentos visibles del documento.</textarea>
            </div>
            <button class="btn btn-success" id="sendBtn">🚀 Enviar a IA</button>
            <button class="btn btn-primary" id="downloadBtn">💾 Bajar PDF Limpio</button>
            <div id="loading-spinner"></div>
        </div>

        <div class="step hidden" id="step4">
            <div class="step-title"><span class="step-number">4</span> Resultado</div>
            <div id="gemini-response"></div>
            <button class="btn btn-primary" onclick="location.reload()">🔄 Reiniciar</button>
        </div>
    </div>

    <script>
        // Configuración de Worker local
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';

        let accumulatedFiles = [];
        let workQueue = [];
        let currentTaskIndex = 0;
        let secureImages = [];
        let finalPdfBytes = null;

        const canvas = document.getElementById('pdfCanvas');
        const ctx = canvas.getContext('2d');
        const selectionBox = document.getElementById('selection-box');

        // Carga de archivos
        document.getElementById('drop-zone').onclick = () => {
            let i = document.createElement('input'); i.type='file'; i.multiple=true; i.onchange=(e)=>handleFiles(e.target.files); i.click();
        };

        function handleFiles(files) {
            accumulatedFiles = [...accumulatedFiles, ...Array.from(files)];
            document.getElementById('file-list').style.display = 'block';
            document.getElementById('file-list').innerHTML = accumulatedFiles.map(f => `<div class="file-item">📄 ${f.name}</div>`).join('');
            document.getElementById('actions').classList.remove('hidden');
        }

        document.getElementById('startBtn').onclick = async () => {
            for (let file of accumulatedFiles) {
                const doc = await pdfjsLib.getDocument(await file.arrayBuffer()).promise;
                for (let p = 1; p <= doc.numPages; p++) workQueue.push({ doc, pageNumber: p });
            }
            showStep(2);
            document.getElementById('work-area').style.display = 'flex';
            loadCurrentPage();
        };

        async function loadCurrentPage() {
            if (currentTaskIndex >= workQueue.length) {
                await generateFinalPdf();
                return;
            }
            const task = workQueue[currentTaskIndex];
            const page = await task.doc.getPage(task.pageNumber);
            const viewport = page.getViewport({ scale: 1.2 });
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            await page.render({ canvasContext: ctx, viewport }).promise;
        }

        // Lógica de dibujo y captura
        let startX, startY, isDrawing = false;

        canvas.onmousedown = (e) => {
            isDrawing = true;
            const r = canvas.getBoundingClientRect();
            startX = e.clientX - r.left; startY = e.clientY - r.top;
            selectionBox.style.display = 'block';
        };

        window.onmousemove = (e) => {
            if (!isDrawing) return;
            const r = canvas.getBoundingClientRect();
            const curX = e.clientX - r.left, curY = e.clientY - r.top;
            selectionBox.style.width = Math.abs(curX - startX) + 'px';
            selectionBox.style.height = Math.abs(curY - startY) + 'px';
            selectionBox.style.left = Math.min(curX, startX) + 'px';
            selectionBox.style.top = Math.min(curY, startY) + 'px';
        };

        window.onmouseup = async (e) => {
            if (!isDrawing) return;
            isDrawing = false;
            const r = canvas.getBoundingClientRect();
            const w = Math.abs((e.clientX - r.left) - startX);
            const h = Math.abs((e.clientY - r.top) - startY);
            selectionBox.style.display = 'none';

            if (w > 10 && h > 10) {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = w; tempCanvas.height = h;
                tempCanvas.getContext('2d').drawImage(canvas, Math.min(startX, (e.clientX - r.left)), Math.min(startY, (e.clientY - r.top)), w, h, 0, 0, w, h);
                secureImages.push(tempCanvas.toDataURL('image/jpeg', 0.9));
                currentTaskIndex++;
                loadCurrentPage();
            }
        };

        document.getElementById('skipPageBtn').onclick = () => {
            currentTaskIndex++;
            loadCurrentPage();
        };

        async function generateFinalPdf() {
            const { PDFDocument } = PDFLib;
            const pdfDoc = await PDFDocument.create();
            for (let dataUrl of secureImages) {
                const img = await pdfDoc.embedJpg(dataUrl);
                const page = pdfDoc.addPage([img.width, img.height]);
                page.drawImage(img, { x: 0, y: 0, width: img.width, height: img.height });
            }
            finalPdfBytes = await pdfDoc.save();
            showStep(3);
        }

        document.getElementById('sendBtn').onclick = async () => {
            const key = document.getElementById('apiKeyInput').value;
            if(!key) return alert("Falta API Key");
            document.getElementById('loading-spinner').style.display = 'block';
            
            const base64 = btoa(new Uint8Array(finalPdfBytes).reduce((d, b) => d + String.fromCharCode(b), ''));
            
            try {
                const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [
                        { text: document.getElementById('promptInput').value },
                        { inline_data: { mime_type: "application/pdf", data: base64 } }
                    ]}]})
                });
                const d = await r.json();
                document.getElementById('gemini-response').innerText = d.candidates[0].content.parts[0].text;
                showStep(4);
            } catch (e) { alert("Error: " + e.message); }
            finally { document.getElementById('loading-spinner').style.display = 'none'; }
        };

        document.getElementById('downloadBtn').onclick = () => saveAs(new Blob([finalPdfBytes]), "anonimizado_final.pdf");

        function showStep(n) {
            document.querySelectorAll('.step').forEach(s => s.classList.add('hidden'));
            document.getElementById('step'+n).classList.remove('hidden');
        }
    </script>
</body>
</html>
