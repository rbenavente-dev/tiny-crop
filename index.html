<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiny Crop</title>
    <style>
        #canvas-container {
            max-width: 800px;
            margin: 0 auto;
        }
        canvas {
            /* Initial width 75% */
            width: 75%;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="myCanvas"></canvas>
    </div>
    <script>
        const canvas = document.getElementById('myCanvas');
        canvas.style.width = '75%';
    </script>
</body>
</html>
